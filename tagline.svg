<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 48" width="590" height="48" role="img" aria-label="developer bullet builder bullet problem solver">
  <defs>
    <clipPath id="reveal" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="0" height="48">
        <animate attributeName="width" from="0" to="568" dur="3s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; fill: #e6edf3; }
    .cursor { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; fill: #e6edf3; animation: blink 1s step-end infinite; }
  </style>
  <text class="tag" x="0" y="30" clip-path="url(#reveal)">&gt; developer &#8226; builder &#8226; problem solver</text>
  <text class="cursor" x="562" y="30">_</text>
</svg>
